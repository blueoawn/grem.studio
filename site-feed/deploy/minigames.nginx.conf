# Include inside the dedicated HTTPS server for minigames.grem.studio.
# This host must have no upstream, redirect, rewrite, or application fallback.
autoindex off;
disable_symlinks on;

add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors https://grem.studio" always;
add_header Permissions-Policy "autoplay=(), camera=(), display-capture=(), fullscreen=(), geolocation=(), microphone=(), payment=(), publickey-credentials-get=(), usb=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cache-Control "no-store" always;
add_header Access-Control-Allow-Origin "https://grem.studio" always;

location ~ ^/games/[A-Za-z0-9_-]+/(index\.html|([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\.(js|css|png|jpe?g|gif|webp|ogg|mp3|wav|mp4|webm))$ {
    # Require a file. The static handler otherwise redirects directory paths.
    if (!-f $request_filename) { return 404; }
    try_files $uri =404;
}

location / {
    return 404;
}
